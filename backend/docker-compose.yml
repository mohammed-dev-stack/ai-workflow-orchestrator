# docker-compose.yml
# ترتيب خدمات منصة مساعد المعرفة بالذكاء الاصطناعي ومنصة أتمتة WhatsApp
# التوافق: Docker Compose v3.8+

version: '3.8'

# ============================================================
# الشبكات
# ============================================================

networks:
  app-network:
    driver: bridge
    name: whatsapp-ai-network
    ipam:
      config:
        - subnet: 172.28.0.0/16

# ============================================================
# وحدات التخزين (Volumes)
# ============================================================

volumes:
  postgres_data:
    name: whatsapp-ai-postgres-data
  redis_data:
    name: whatsapp-ai-redis-data
  pgadmin_data:
    name: whatsapp-ai-pgadmin-data
  backend_node_modules:
    name: whatsapp-ai-backend-node-modules
  frontend_node_modules:
    name: whatsapp-ai-frontend-node-modules

# ============================================================
# الخدمات
# ============================================================

services:
  # ==========================================================
  # قاعدة البيانات PostgreSQL + pgvector
  # ==========================================================
  postgres:
    image: pgvector/pgvector:pg16
    container_name: whatsapp-ai-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-whatsapp_ai}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-whatsapp_ai_secure_password}
      POSTGRES_DB: ${POSTGRES_DB:-whatsapp_ai_db}
      PGPORT: ${POSTGRES_PORT:-5432}
    ports:
      - "${POSTGRES_EXPOSED_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./backend/src/db/migrations:/docker-entrypoint-initdb.d
    networks:
      - app-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-whatsapp_ai} -d ${POSTGRES_DB:-whatsapp_ai_db}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    command: >
      postgres
      -c shared_buffers=256MB
      -c work_mem=64MB
      -c maintenance_work_mem=128MB
      -c effective_cache_size=1GB
      -c max_connections=100
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
    deploy:
      resources:
        limits:
          memory: 2G
        reservations:
          memory: 512M

  # ==========================================================
  # Redis (لتخزين مؤقت وقوائم انتظار BullMQ)
  # ==========================================================
  redis:
    image: redis:7-alpine
    container_name: whatsapp-ai-redis
    restart: unless-stopped
    command: >
      redis-server
      --appendonly yes
      --appendfsync everysec
      --maxmemory 256mb
      --maxmemory-policy allkeys-lru
      --save 900 1
      --save 300 10
      --save 60 10000
    ports:
      - "${REDIS_EXPOSED_PORT:-6379}:6379"
    volumes:
      - redis_data:/data
    networks:
      - app-network
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 5s
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
    deploy:
      resources:
        limits:
          memory: 512M
        reservations:
          memory: 128M

  # ==========================================================
  # pgAdmin 4 (إدارة قاعدة البيانات)
  # ==========================================================
  pgadmin:
    image: dpage/pgadmin4:latest
    container_name: whatsapp-ai-pgadmin
    restart: unless-stopped
    environment:
      PGADMIN_DEFAULT_EMAIL: ${PGADMIN_DEFAULT_EMAIL:-admin@whatsapp-ai.local}
      PGADMIN_DEFAULT_PASSWORD: ${PGADMIN_DEFAULT_PASSWORD:-admin_secure_password}
      PGADMIN_CONFIG_SERVER_MODE: 'False'
      PGADMIN_CONFIG_MASTER_PASSWORD_REQUIRED: 'False'
    ports:
      - "${PGADMIN_EXPOSED_PORT:-5050}:80"
    volumes:
      - pgadmin_data:/var/lib/pgadmin
    networks:
      - app-network
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:80/misc/ping"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
    deploy:
      resources:
        limits:
          memory: 256M
        reservations:
          memory: 64M

  # ==========================================================
  # الواجهة الخلفية (Backend)
  # ==========================================================
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
      target: production
    container_name: whatsapp-ai-backend
    restart: unless-stopped
    environment:
      NODE_ENV: ${NODE_ENV:-production}
      PORT: ${BACKEND_PORT:-3000}
      DATABASE_URL: postgresql://${POSTGRES_USER:-whatsapp_ai}:${POSTGRES_PASSWORD:-whatsapp_ai_secure_password}@postgres:5432/${POSTGRES_DB:-whatsapp_ai_db}
      REDIS_URL: redis://redis:6379
      JWT_SECRET: ${JWT_SECRET}
      JWT_EXPIRY: ${JWT_EXPIRY:-7d}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY}
      ANTHROPIC_MODEL: ${ANTHROPIC_MODEL:-claude-3-sonnet-20241022}
      ANTHROPIC_MAX_TOKENS: ${ANTHROPIC_MAX_TOKENS:-4096}
      ANTHROPIC_TEMPERATURE: ${ANTHROPIC_TEMPERATURE:-0.3}
      ANTHROPIC_FALLBACK_MODEL: ${ANTHROPIC_FALLBACK_MODEL:-claude-3-haiku-20240307}
      CIRCUIT_BREAKER_TIMEOUT: ${CIRCUIT_BREAKER_TIMEOUT:-30000}
      CIRCUIT_BREAKER_ERROR_THRESHOLD: ${CIRCUIT_BREAKER_ERROR_THRESHOLD:-5}
      RETRY_MAX_ATTEMPTS: ${RETRY_MAX_ATTEMPTS:-3}
      RETRY_BACKOFF_BASE: ${RETRY_BACKOFF_BASE:-1000}
      WHATSAPP_API_TOKEN: ${WHATSAPP_API_TOKEN}
      WHATSAPP_VERIFY_TOKEN: ${WHATSAPP_VERIFY_TOKEN}
      WHATSAPP_API_VERSION: ${WHATSAPP_API_VERSION:-v18.0}
      WHATSAPP_PHONE_NUMBER_ID: ${WHATSAPP_PHONE_NUMBER_ID:-}
      OTEL_EXPORTER_OTLP_ENDPOINT: ${OTEL_EXPORTER_OTLP_ENDPOINT:-}
      LOG_LEVEL: ${LOG_LEVEL:-info}
      IDEMPOTENCY_TTL: ${IDEMPOTENCY_TTL:-86400}
      RATE_LIMIT_WINDOW_MS: ${RATE_LIMIT_WINDOW_MS:-60000}
      RATE_LIMIT_MAX_REQUESTS: ${RATE_LIMIT_MAX_REQUESTS:-100}
      CORS_ORIGIN: ${CORS_ORIGIN:-http://localhost:5173}
      ENCRYPTION_KEY: ${ENCRYPTION_KEY}
    ports:
      - "${BACKEND_EXPOSED_PORT:-3000}:3000"
    volumes:
      - backend_node_modules:/app/node_modules
      - ./backend:/app
    networks:
      - app-network
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "node", "-e", "require('http').get('http://localhost:3000/health', (r) => {process.exit(r.statusCode === 200 ? 0 : 1)})"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
    deploy:
      resources:
        limits:
          memory: 1G
        reservations:
          memory: 256M

  # ==========================================================
  # الواجهة الأمامية (Frontend)
  # ==========================================================
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      target: production
    container_name: whatsapp-ai-frontend
    restart: unless-stopped
    environment:
      VITE_API_URL: ${VITE_API_URL:-http://localhost:3000}
      VITE_WS_URL: ${VITE_WS_URL:-ws://localhost:3000}
    ports:
      - "${FRONTEND_EXPOSED_PORT:-5173}:5173"
    volumes:
      - frontend_node_modules:/app/node_modules
      - ./frontend:/app
    networks:
      - app-network
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "node", "-e", "require('http').get('http://localhost:5173', (r) => {process.exit(r.statusCode === 200 ? 0 : 1)})"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
    deploy:
      resources:
        limits:
          memory: 512M
        reservations:
          memory: 128M

# ============================================================
# الإعدادات الافتراضية للبيئة (لتسهيل التطوير)
# ============================================================
# يمكن إنشاء ملف .env في الجذر لتجاوز هذه القيم:
# POSTGRES_USER=whatsapp_ai
# POSTGRES_PASSWORD=your_secure_password
# POSTGRES_DB=whatsapp_ai_db
# JWT_SECRET=your_jwt_secret_32_chars_minimum
# ANTHROPIC_API_KEY=sk-ant-your-api-key
# WHATSAPP_API_TOKEN=your_whatsapp_token
# WHATSAPP_VERIFY_TOKEN=your_verify_token
# ENCRYPTION_KEY=your_32_byte_encryption_key_base64